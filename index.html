<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#cfe9e4}

[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:ui-rounded,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#g{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;color:#2d3b3a}
canvas{display:block;width:100%;height:100%;touch-action:none}
.p{position:absolute;background:#fffd;border-radius:.8em;padding:.35em .6em;box-shadow:0 .15em .4em #0003}

#tm{left:50%;transform:translateX(-50%);top:.6em;text-align:center;font-weight:700}
#mn{right:.6em;top:.6em;display:flex;gap:.5em;align-items:center;font-weight:700}
button{font:inherit;border:0;border-radius:.7em;background:#6fb8b0;color:#fff;padding:.45em .8em;cursor:pointer;font-weight:700}

#x{background:#e8929a}

#cr{position:absolute;inset:0;pointer-events:none}

.hb{position:absolute;left:0;right:0;top:0;height:13.9%;background:#8fc7c1;color:#fff;font-weight:800;font-size:2.3em;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;pointer-events:none}
.hf{position:absolute;top:13.9%;bottom:0;width:50%}

.tb svg{width:100%;height:100%}

#sbar i{display:block;height:100%;width:40%;background:#6fb8b0;border-radius:1em;animation:ldm 1.2s ease-in-out infinite}

#ai{font-size:.7em;opacity:.7;text-align:center;margin-top:.3em}.row{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap}.rd{background:#e8929a}.gy{background:#b9c2c6}.gn{background:#6fb8b0}
#ld{justify-content:center;gap:.9em}#ld .lt{font-size:1.6em;font-weight:800;color:#2d5a55}#ltip{font-size:.9em;color:#2d5a55;opacity:.85}

.sr{display:flex;align-items:center;gap:.4em}.sr u{display:block;flex:1;height:.6em;background:#0002;border-radius:1em;overflow:hidden}.sr i{display:block;height:100%}.sr b{width:2.6em;text-align:right}

#tm{top:.5em;padding:.25em .8em}#mw{left:50%;transform:translateX(-50%);top:2.7em;font-weight:700;white-space:nowrap;padding:.25em .8em}

function muTone(f,t,d,w,v,at){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=w;o.frequency.value=f;at=at||.012;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0008,t+Math.max(at+.02,d));o.connect(g);g.connect(MU.musG);o.start(t);o.stop(t+d+.05)}

function muKick(t){const a=AC,o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(MU.musG);o.start(t);o.stop(t+.22)}

if(tr.arp&&tr.arp.pat[s]=='x')muTone(MF(rt+12+ch[(s>>1)%ch.length]),t,d*1.5,tr.arp.w,tr.arp.v);
if(tr.lead&&tr.lead.mask[s]=='x'&&Math.random()<tr.lead.pr)muTone(MF(rt+tr.lead.oct*12+12+tr.lead.p[rnd(tr.lead.p.length)]),t,d*(tr.lead.len||2),tr.lead.w,tr.lead.v,.02);
